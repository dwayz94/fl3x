# Render Blueprint: API + managed Postgres.
# Dashboard → New → Blueprint → pick this repo.
databases:
  - name: fl3x-db
    plan: basic-256mb
    databaseName: fl3x
    user: fl3x

services:
  - type: web
    name: fl3x-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build -w @fl3x/api
    startCommand: npm run start -w @fl3x/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths: ["apps/api/**", "packages/shared/**", "package-lock.json", "render.yaml"]
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: fl3x-db, property: connectionString }
      - key: WEB_ORIGIN
        value: https://fl3x.lol,https://www.fl3x.lol
      - key: LAUNCH_PHASE
        value: invite_only
      - key: TOKEN_SYMBOL
        value: FL3X
      - key: TIER_STARTER_MIN
        value: "100000"
      - key: TIER_PREMIUM_MIN
        value: "1000000"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ANALYTICS_SALT
        generateValue: true
      - key: CONNECTIONS_SECRET
        generateValue: true
      - key: API_PUBLIC_URL
        value: https://api.fl3x.lol
      - key: MORALIS_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: TOKEN_MINT
        sync: false
      - key: SENTRY_DSN
        sync: false
